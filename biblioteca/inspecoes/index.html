<body data-page="inspecoes">
    <div id="site-header"></div>

    <main id="main-content" class="conteudo-interno inspecoes-hub">
        <header class="inspecoes-hub-header">
            <p class="guia-badge" data-i18n="pages.inspections.eyebrow">Biblioteca</p>
            <h1 data-i18n="pages.inspections.title">Inspeções</h1>
            <p class="secao-subtitulo inspecoes-hub-lead" data-i18n="pages.inspections.subtitle">Relatórios técnicos de cultivo — plantas, frutos, animais, fungos, derivados de risco e equipamento.</p>
        </header>

        <nav id="inspecoes-filters" class="videos-filters-wrap" aria-label="Filtrar por série" data-i18n-aria="pages.inspections.filtersLabel"></nav>

        <div class="videos-search-wrap inspecoes-search-wrap">
            <label class="videos-search-label" for="inspecoes-search" data-i18n="pages.inspections.searchLabel">Buscar</label>
            <input
                type="search"
                id="inspecoes-search"
                class="videos-search-input"
                placeholder="Título, série ou planta…"
                data-i18n-placeholder="pages.inspections.searchPlaceholder"
                autocomplete="off"
                enterkeyhint="search"
            >
        </div>

        <div id="inspecoes-list" class="inspecoes-list">
            <p class="empty-message" data-i18n="pages.inspections.loading">Carregando…</p>
        </div>
        <p class="videos-more-wrap comunidade-more-wrap">
            <button type="button" id="inspecoes-load-more" class="botao botao-outline" hidden data-i18n="pages.inspections.loadMore">Carregar mais</button>
        </p>

        <section id="inspecoes-sugestoes" class="inspecoes-hub-panel inspecoes-sugestoes" hidden>
            <header class="inspecoes-hub-panel-head">
                <h2 class="category-title" data-i18n="pages.inspections.sectionSuggestions">Sugestões</h2>
                <p class="inspecoes-hub-section-desc" data-i18n="pages.inspections.sectionSuggestionsDesc">Fila editorial do laboratório — ideias e próximos relatórios de cultivo, separados das inspeções já publicadas.</p>
            </header>
            <div class="inspecoes-sug-filters" role="group" aria-label="Filtro de sugestões">
                <button type="button" class="inspecoes-sug-filter is-active" data-sug-filter="abertas" aria-pressed="true" data-i18n="pages.inspections.sugFilterOpen">Abertas</button>
                <button type="button" class="inspecoes-sug-filter" data-sug-filter="feitas" aria-pressed="false" data-i18n="pages.inspections.sugFilterDone">Feitas</button>
                <button type="button" class="inspecoes-sug-filter" data-sug-filter="todas" aria-pressed="false" data-i18n="pages.inspections.sugFilterAll">Todas</button>
            </div>
            <div class="inspecoes-sug-list" data-inspecoes-sugestoes-list>
                <p class="empty-message" data-i18n="pages.inspections.loading">Carregando…</p>
            </div>
        </section>
    </main>

    <div id="site-footer"></div>

    <script src="/js/posts.js?v=357"></script>
