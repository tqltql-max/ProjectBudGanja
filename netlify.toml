# Netlify — site estático + Functions (Admin online)

[build]
  command = "npm run build"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = ["posts.json", "sorteios.json", "content/pages.json", "content/site.json", "content/sorteio.json", "content/guia-cultivo.json", "content/youtube-feed.json", "content/users.json", "content/user-sessions.json", "search-index.json"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(self), camera=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://i.ytimg.com https://http2.mlstatic.com https://lh3.googleusercontent.com https://www.gstatic.com; media-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://pay.google.com https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style https://fonts.googleapis.com; connect-src 'self' https://pay.google.com https://api.stripe.com https://accounts.google.com/gsi/ https://oauth2.googleapis.com https://generativelanguage.googleapis.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com https://docs.google.com https://accounts.google.com/gsi/ https://aladin.cds.unistra.fr https://aladin.u-strasbg.fr https://stellarium-web.org; base-uri 'self'; form-action 'self' https://accounts.google.com"

[[headers]]
  for = "/imagens/og-*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/imagens/inspecoes/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Cross-Origin-Resource-Policy = "cross-origin"

[[headers]]
  for = "/imagens/*.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/imagens/background-hero.png"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/imagens/background-hero.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imagens/background-hero*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imagens/background-hero*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imagens/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# Domínio EN: apex → www (versão inglesa; i18n.js força locale "en")
[[redirects]]
  from = "https://inspectorbudganja.com/*"
  to = "https://www.inspectorbudganja.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://inspectorbudganja.com/"
  to = "https://www.inspectorbudganja.com/"
  status = 301
  force = true

[[redirects]]
  from = "/"
  to = "/inverno/"
  status = 302

[[redirects]]
  from = "/inicio"
  to = "/inverno/"
  status = 302

[[redirects]]
  from = "/inicio/"
  to = "/inverno/"
  status = 302

[[redirects]]
  from = "/index.html"
  to = "/inverno/"
  status = 302

[[redirects]]
  from = "/inverno"
  to = "/inverno/"
  status = 301

[[redirects]]
  from = "/jogos/zangado/:id"
  to = "/jogos/video.html"
  status = 200

[[redirects]]
  from = "/jogos/aleff/:id"
  to = "/jogos/video.html"
  status = 200

[[redirects]]
  from = "/jogos/aleph/:id"
  to = "/jogos/video.html"
  status = 200

[[redirects]]
  from = "/jogos/paulinho/:id"
  to = "/jogos/video.html"
  status = 200

[[redirects]]
  from = "/jogos/paulinho"
  to = "/jogos/aleff/"
  status = 301

[[redirects]]
  from = "/jogos/paulinho/"
  to = "/jogos/aleff/"
  status = 301

[[redirects]]
  from = "/jogos/aleph"
  to = "/jogos/aleff/"
  status = 301

[[redirects]]
  from = "/jogos/aleph/"
  to = "/jogos/aleff/"
  status = 301

# Function isolada: o bundle de /api estourava o timeout no cold start (502).
[[redirects]]
  from = "/api/auth/google/start"
  to = "/.netlify/functions/auth-google-start"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/uploads?name=:splat"
  status = 200
  force = true

[[redirects]]
  from = "/post-:slug.html"
  to = "/.netlify/functions/render-post?slug=:slug"
  status = 200
  force = true
