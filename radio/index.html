<body data-page="radio">
    <div id="site-header"></div>

    <main id="main-content" class="conteudo radio-page">
        <div class="radio-atmosphere" aria-hidden="true"></div>

        <header class="radio-hero">
            <p class="radio-hero-brand">Inspetor BudGanja</p>
            <h1 id="radio-page-title">BudGanja Radio</h1>
            <p id="radio-page-subtitle" class="radio-hero-sub">Playlist do laboratório — ouça e partilhe as faixas do Inspetor BudGanja.</p>
            <p id="radio-page-owner" class="radio-page-owner" hidden></p>
        </header>

        <section class="radio-stage" id="radio-stage" aria-label="Player">
            <div class="radio-disc" id="radio-disc" aria-hidden="true">
                <div class="radio-disc-glow"></div>
                <div class="radio-disc-ring"></div>
                <img
                    class="radio-disc-art"
                    src="/imagens/icon-512.v301.png"
                    alt=""
                    width="160"
                    height="160"
                    decoding="async"
                >
                <div class="radio-eq" aria-hidden="true">
                    <i></i><i></i><i></i><i></i><i></i>
                </div>
            </div>

            <div class="radio-now">
                <span class="radio-player-label">A tocar</span>
                <strong id="radio-now-title">—</strong>
                <span id="radio-now-artist" class="radio-now-artist"></span>
            </div>

            <div class="radio-player-progress">
                <input type="range" id="radio-seek" min="0" max="1000" value="0" step="1" aria-label="Posição da faixa">
                <div class="radio-player-times">
                    <span id="radio-time-current">0:00</span>
                    <span id="radio-time-duration">0:00</span>
                </div>
            </div>

            <div class="radio-transport" role="group" aria-label="Controlos">
                <button type="button" class="radio-ctrl" id="radio-prev" aria-label="Faixa anterior">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M6 6h2v12H6V6zm3.5 6 8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button type="button" class="radio-ctrl radio-ctrl--play" id="radio-play" aria-label="Reproduzir">
                    <svg class="radio-icon-play" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 5v14l11-7L8 5z"/></svg>
                    <svg class="radio-icon-pause" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true" focusable="false" hidden><path fill="currentColor" d="M6 5h4v14H6V5zm8 0h4v14h-4V5z"/></svg>
                </button>
                <button type="button" class="radio-ctrl" id="radio-next" aria-label="Faixa seguinte">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 6h2v12h-2V6zM6 18l8.5-6L6 6v12z"/></svg>
                </button>
            </div>

            <div class="radio-page-actions">
                <button type="button" class="radio-action" id="radio-share-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 18 7.91c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.96 9.81A2.99 2.99 0 0 0 6 9.09c-1.66 0-3 1.34-3 3s1.34 3 3 3c.76 0 1.44-.3 1.96-.77l7.12 4.16c-.05.21-.08.43-.08.61 0 1.61 1.31 2.91 2.92 2.91s2.92-1.3 2.92-2.91-1.31-2.91-2.92-2.91z"/></svg>
                    Partilhar rádio
                </button>
                <button type="button" class="radio-action" id="radio-share-track-btn" aria-label="Partilhar faixa a tocar">
                    <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 3v10.55A3.99 3.99 0 0 0 10 13c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
                    Partilhar música
                </button>
            </div>

            <p id="radio-page-status" class="conta-status radio-page-status" role="status"></p>
        </section>

        <section class="radio-tracklist-wrap" aria-label="Lista de faixas">
            <div class="radio-tracklist-head">
                <div class="radio-tracklist-head-copy">
                    <h2 class="radio-tracklist-title">Playlist</h2>
                    <p class="radio-tracklist-hint">Arrasta as faixas pela alça ⋮⋮ para mudar a ordem.</p>
                </div>
                <div class="radio-tracklist-head-actions">
                    <span id="radio-track-count" class="radio-track-count"></span>
                    <button type="button" id="radio-order-reset" class="radio-order-reset" hidden>Ordem original</button>
                </div>
            </div>
            <ol id="radio-tracklist" class="radio-tracklist">
                <li class="field-hint">A carregar playlist…</li>
            </ol>
        </section>
    </main>

    <div id="radio-share-sheet" class="radio-share-sheet" hidden>
        <button type="button" class="radio-share-backdrop" data-radio-share-close aria-label="Fechar partilha"></button>
        <div class="radio-share-panel" role="dialog" aria-modal="true" aria-labelledby="radio-share-heading">
            <div class="radio-share-panel-top">
                <p class="radio-share-kicker">Partilhar</p>
                <button type="button" class="radio-share-close" data-radio-share-close aria-label="Fechar">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18.3 5.71 12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.3 19.71 2.89 18.3 9.17 12 2.89 5.71 4.3 4.29l6.29 6.3 6.3-6.3 1.41 1.42z"/></svg>
                </button>
            </div>
            <div class="radio-share-preview">
                <img id="radio-share-cover" class="radio-share-cover" src="/imagens/og-radio.jpg" alt="" width="1200" height="630" decoding="async">
                <div class="radio-share-preview-body">
                    <p class="radio-share-brand">BudGanja Radio</p>
                    <strong id="radio-share-heading">Playlist do laboratório</strong>
                    <span id="radio-share-sub">Inspetor BudGanja</span>
                </div>
            </div>
            <div class="radio-share-actions">
                <button type="button" class="radio-share-chip radio-share-chip--primary" id="radio-share-native">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11A2.99 2.99 0 0 0 18 7.91c1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L7.96 9.81A2.99 2.99 0 0 0 6 9.09c-1.66 0-3 1.34-3 3s1.34 3 3 3c.76 0 1.44-.3 1.96-.77l7.12 4.16c-.05.21-.08.43-.08.61 0 1.61 1.31 2.91 2.92 2.91s2.92-1.3 2.92-2.91-1.31-2.91-2.92-2.91z"/></svg>
                    Partilhar
                </button>
                <a class="radio-share-chip radio-share-chip--wa" id="radio-share-wa" href="#" target="_blank" rel="noopener noreferrer">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.86 9.86 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.76 14.07c-.24.68-1.42 1.25-1.96 1.33-.5.07-1.14.1-1.84-.12-.42-.13-.97-.32-1.67-.62-2.94-1.27-4.85-4.24-5-4.44-.14-.2-1.18-1.57-1.18-3 0-1.42.74-2.12 1-2.41.26-.29.57-.36.76-.36h.55c.17 0 .41-.07.64.49.24.58.82 2 .89 2.15.07.14.12.32.02.51-.1.2-.14.32-.29.49-.14.17-.31.38-.44.51-.14.14-.29.29-.12.57.17.29.75 1.24 1.61 2.01 1.11.99 2.04 1.3 2.33 1.44.29.14.46.12.63-.07.17-.2.72-.84.91-1.13.19-.29.39-.24.64-.14.26.1 1.64.77 1.92.91.29.14.48.22.55.34.07.12.07.68-.17 1.36z"/></svg>
                    WhatsApp
                </a>
                <button type="button" class="radio-share-chip" id="radio-share-copy">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                    Copiar link
                </button>
            </div>
            <p class="radio-share-url" id="radio-share-url" aria-live="polite"></p>
        </div>
    </div>
    <div id="radio-share-toast" class="radio-share-toast" role="status" aria-live="polite" hidden></div>

    <div id="site-footer"></div>
